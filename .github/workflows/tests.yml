name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # No NLTK corpora are needed: only the Porter stemmer (pure Python) is used.
      - name: Run tests
        run: pytest
      - name: Reproduce the evaluation (lightweight methods)
        run: python -m botbuddy.evaluate --methods keyword tfidf hybrid
